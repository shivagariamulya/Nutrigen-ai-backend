# ========================================================
# NutriGen Production Configuration (Render Web Service)
# ========================================================

# Dynamic port assigned by Render ($PORT)
server.port=${PORT:8080}

# Database Connection via Render Environment Variables
# (Seamlessly supports both Render Native PostgreSQL and Render MySQL)
spring.datasource.url=${DB_URL:${DATABASE_URL:}}
spring.datasource.username=${DB_USER:}
spring.datasource.password=${DB_PASS:}

# JPA & Hibernate Settings for Production
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Cross-Origin Resource Sharing (Render Frontend Static Site URL)
frontend.url=${FRONTEND_URL}
cors.allowed-origins=${FRONTEND_URL}

# Authentication & Secret Tokens
jwt.secret=${JWT_SECRET}

# File Upload Thresholds for Image Analysis
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=30MB

# Google Gemini Vision AI API Configuration
gemini.api.key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-2.5-flash}
gemini.mock.fallback=true

# Error Handling
server.error.include-message=always
server.error.include-binding-errors=always
