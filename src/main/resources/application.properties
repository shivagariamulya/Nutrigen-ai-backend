# ==========================================
# NutriGen AI - Spring Boot Configuration
# ==========================================

# Application
spring.application.name=nutrigen
server.port=${PORT:8080}


# ==========================================
# Aiven MySQL Database Configuration
# ==========================================

spring.datasource.url=${DB_URL:jdbc:mysql://nutrigen-mysql-shivagariamulya-8607.g.aivencloud.com:25881/defaultdb?sslMode=REQUIRED&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:avnadmin}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# ==========================================
# JPA / Hibernate Configuration
# ==========================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false


# ==========================================
# File Upload Configuration
# ==========================================

# Maximum size for a single uploaded file
spring.servlet.multipart.max-file-size=15MB

# Maximum total request size
spring.servlet.multipart.max-request-size=30MB


# ==========================================
# Gemini AI Configuration
# ==========================================

gemini.api.key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-2.5-flash}
gemini.mock.fallback=true


# ==========================================
# Error Handling
# ==========================================

server.error.include-message=never
server.error.include-binding-errors=never