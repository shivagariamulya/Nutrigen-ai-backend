spring.application.name=nutrigen
server.port=${PORT:8080}

# Database Configuration (supports DB_URL, DB_USER, DB_PASS with local dev fallback)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/nutrigen?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:${DB_USERNAME:nutrigen}}
spring.datasource.password=${DB_PASS:${DB_PASSWORD:root}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# CORS & Frontend Cross-Service Connection
frontend.url=${FRONTEND_URL:}
cors.allowed-origins=${FRONTEND_URL:}

# Security Secrets
jwt.secret=${JWT_SECRET:nutrigen-default-secret-key-change-in-prod}

# Support multi-photo batch uploads up to 30MB total
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=30MB

# Gemini AI Configuration
gemini.api.key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-2.5-flash}
gemini.mock.fallback=true

# Error Reporting
server.error.include-message=always
server.error.include-binding-errors=always